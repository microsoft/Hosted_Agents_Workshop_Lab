name: Markdown Link Check (PR)

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/markdown-links.yml"

permissions:
  contents: read

concurrency:
  group: markdown-links-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate local markdown links
        shell: bash
        run: |
          set -euo pipefail

          echo "Scanning markdown files for local link validity..."

          broken=0

          # Read files via process substitution so the counter survives (no subshell).
          while IFS= read -r md_file; do
            # Extract markdown links: [text](target). `|| true` prevents grep's
            # exit code 1 (no matches in a linkless file) from aborting under pipefail.
            targets=$(grep -oP '\[.+?\]\(\K[^)]+(?=\))' "$md_file" || true)
            [ -z "$targets" ] && continue

            while IFS= read -r target; do
              # Skip external/special links and pure anchors.
              if [[ "$target" =~ ^(https?://|mailto:|javascript:|#) ]]; then
                continue
              fi

              # Strip anchor and query string.
              target_path="${target%%[#?]*}"
              [ -z "$target_path" ] && continue

              # Resolve relative path.
              resolved=$(cd "$(dirname "$md_file")" && realpath "$target_path" 2>/dev/null || echo "")

              if [ -z "$resolved" ] || [ ! -e "$resolved" ]; then
                echo "❌ BROKEN: $md_file -> $target"
                broken=$((broken + 1))
              fi
            done <<< "$targets"
          done < <(find . -type f -name "*.md" ! -path "./node_modules/*" ! -path "./.git/*")

          if [ "$broken" -gt 0 ]; then
            echo ""
            echo "Found $broken broken local link(s)."
            exit 1
          else
            echo "✓ All local markdown links are valid."
          fi
