# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: workshoplab
metadata:
    template: workshoplab-foundry-hosted-agent
services:
    hosted-agent-readiness-coach:
        project: ./src/WorkshopLab.AgentHost
        host: azure.ai.agent
        language: docker
        docker:
            path: ./Dockerfile
            context: ../
            remoteBuild: true
        config:
            container:
                resources:
                    cpu: "0.5"
                    memory: 1Gi
            deployments:
                - model:
                    format: OpenAI
                    name: gpt-5.4-mini
                    version: "2026-03-17"
                  name: gpt-5.4-mini
                  sku:
                    capacity: 10
                    name: GlobalStandard
            startupCommand: dotnet run
hooks:
    # After the agent is deployed, grant its managed identity the model/data-plane roles
    # it needs to run — so `azd ai agent invoke` and the Lab 5 UI work without a manual
    # RBAC step. Idempotent and non-fatal (see scripts/grant-agent-identity-roles.ps1).
    postdeploy:
        windows:
            shell: pwsh
            run: ./scripts/grant-agent-identity-roles.ps1
            continueOnError: true
            interactive: false
        posix:
            shell: pwsh
            run: ./scripts/grant-agent-identity-roles.ps1
            continueOnError: true
            interactive: false
infra:
    provider: bicep
pipeline:
    provider: github
    variables: []
    secrets: []
